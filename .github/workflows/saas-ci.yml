name: SaaS checks
on:
  pull_request:
  push:
    branches: [codex/saas-autonomo]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agencialabs_test
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: isolated_ci_database
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qa -d agencialabs_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://qa:isolated_ci_database@127.0.0.1:5432/agencialabs_test
      SITE_URL: http://127.0.0.1:3400
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1026
      MAIL_FROM: qa@example.test
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ephemeral test secrets
        run: node -e 'const fs=require("node:fs"),c=require("node:crypto");fs.appendFileSync(process.env.GITHUB_ENV,"BETTER_AUTH_SECRET="+c.randomBytes(48).toString("base64url")+"\nTOKEN_ENCRYPTION_KEY="+c.randomBytes(32).toString("base64")+"\n")'
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm run build
      - name: Start production bundle
        run: |
          cp -R public .next/standalone/public
          cp -R .next/static .next/standalone/.next/static
          HOSTNAME=127.0.0.1 PORT=3400 node .next/standalone/server.js > /tmp/agencialabs-ci.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3400/api/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: node --import tsx --test tests/access.integration.test.ts tests/reporting.test.mjs
      - name: Package Linux standalone release
        run: |
          mkdir -p work/release/runtime work/release/tools
          cp -a .next/standalone/. work/release/runtime/
          cp -R db lib scripts work/release/tools/
          cp tsconfig.json deploy/tools/package*.json work/release/tools/
          npm ci --prefix work/release/tools --no-audit --no-fund
          (cd work/release/tools && node --import tsx scripts/migrate.ts)
          tar -czf work/agencialabs-linux-amd64.tar.gz -C work/release .
          sha256sum work/agencialabs-linux-amd64.tar.gz > work/agencialabs-linux-amd64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: agencialabs-linux-amd64
          path: |
            work/agencialabs-linux-amd64.tar.gz
            work/agencialabs-linux-amd64.sha256
          retention-days: 14
      - name: Validate Docker deployment builds
        run: docker build --target runtime -t agencialabs:ci .
